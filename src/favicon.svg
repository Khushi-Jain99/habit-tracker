<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Habit Tracker Logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#99f6e4" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)" />

  <circle cx="32" cy="32" r="19" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="5" />
  <circle
    cx="32"
    cy="32"
    r="19"
    fill="none"
    stroke="url(#ring)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-dasharray="95 30"
    transform="rotate(-90 32 32)"
    filter="url(#softGlow)"
  />

  <path
    d="M21.5 33.5l7.2 7.1 13.8-15.3"
    fill="none"
    stroke="#f8fafc"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="46.5" cy="18" r="3" fill="#fde68a" />
</svg>
